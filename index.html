<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parami အလှူရှင်များ စာရင်း</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Padauk) -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Padauk', sans-serif;
        }
        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .header-card {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.2);
            margin-bottom: 20px;
        }
        .header-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: white;
            padding: 5px;
            margin-bottom: 12px;
        }
        .header-card h1 {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }
        .header-card p {
            margin: 6px 0 0 0;
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.5;
        }
        .donor-card {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .donor-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .donor-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #059669;
        }
        .donor-details h3 {
            margin: 0;
            font-size: 15px;
            color: #1f2937;
        }
        .btn-detail {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #10b981;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f3f4f6;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            color: #6b7280;
        }
        .modal-profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #059669;
            display: block;
            margin: 0 auto 10px auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Banner -->
        <div class="header-card">
            <img src="logo.png" class="header-logo" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
            <h1>Parami အလှူရှင်များ စာရင်း</h1>
            <p>ဂုဏ်ယူဝမ်းမြောက်စွာဖြင့် လှူဒါန်းပေးကြသော အလှူရှင်များ၏ စာရင်းရှင်းတမ်းများ</p>
        </div>

        <!-- အလှူရှင်များ စာရင်း သီးသန့် Grid Container -->
        <div id="public-donors-grid">
            <p style="text-align: center; color: #6b7280;">အလှူရှင်များ စာရင်း ဆွဲထုတ်နေပါသည်...</p>
        </div>
    </div>

    <!-- Donor Detail Modal Popup (အလှူရှင် အသေးစိတ် ကြည့်ရန်) -->
    <div id="donor-detail-modal" class="modal-overlay">
        <div class="modal-content" style="text-align: center;">
            <button class="close-btn" onclick="closeDonorModal()">&times;</button>
            
            <img id="modal-donor-photo" class="modal-profile-img" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Donor Photo" onclick="openImageViewer(this.src)" style="cursor: pointer;">
            <h3 id="modal-donor-name" style="margin: 0; color: #1f2937;">-</h3>
            <p id="modal-donor-amount" style="margin: 6px 0 15px 0; font-weight: bold; font-size: 18px; color: #059669;">-</p>

            <div style="text-align: left; background: #f9fafb; padding: 14px; border-radius: 10px; border: 1px solid #e5e7eb; font-size: 13px; color: #374151;">
                <p style="margin: 4px 0 8px 0;"><strong>လိပ်စာ / လမ်းကြောင်း:</strong> <span id="modal-donor-address" style="color: #4b5563;">-</span></p>
                <p style="margin: 4px 0 8px 0;"><strong>မှတ်ချက်:</strong> <span id="modal-donor-note" style="color: #4b5563;">-</span></p>
                <p style="margin: 4px 0 0 0;"><strong>လှူဒါန်းသည့် ရက်စွဲ:</strong> <span id="modal-donor-date" style="color: #4b5563;">-</span></p>
            </div>
        </div>
    </div>

    <!-- Image Viewer Modal (အလှူရှင်ပုံ အကြီးကြည့်ရန်) -->
    <div id="image-viewer-modal" class="modal-overlay" style="z-index: 1100;">
        <div style="position: relative; max-width: 90%; max-height: 90vh;">
            <button class="close-btn" onclick="closeImageViewer()" style="position: absolute; top: -12px; right: -12px; z-index: 10; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.3); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer;">&times;</button>
            <img id="full-image-preview" src="" style="max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; display: block; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
